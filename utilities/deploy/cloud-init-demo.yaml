#cloud-config
# Builds a demo server on an Ubuntu cloud image, and updates it on every restart: it pulls the
# latest code, keeps the existing database and passwords, and only adds what is missing.
# Change the values in the "settings" block of install-demo.sh before using it for another city.
ssh_pwauth: false
package_update: true
packages: [git, ca-certificates, curl, ufw]
write_files:
  - path: /var/lib/cloud/scripts/per-boot/install-demo.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      # Runs at every start. Output goes to /var/log/install-demo.log
      exec >> /var/log/install-demo.log 2>&1
      echo "---- $(date -u)"
      set -e
      # ---- settings ----
      HOSTS="utilities.osceolamo.com, utilities-test.osceolamo.com"
      MAIN_HOST=utilities.osceolamo.com
      ADMIN_EMAIL=coryscline@gmail.com
      TEST_DOMAIN=corycline.com
      # Shown on the demo the first time it is set up; change them in the app afterwards.
      CITY_NAME="City of Osceola"
      CITY_SETTINGS='{"phone": "(417) 646-8421", "office_hours": "Monday to Friday, 8:00 AM to 4:00 PM", "return_address": "City of Osceola\n210 Olive St\nOsceola, MO 64776", "remit_to": "City of Osceola, 210 Olive St, Osceola, MO 64776", "theme_color": "#173f4a", "accent_color": "#8f2f1f", "rule_color": "#d9a33a", "demo_branded": true}'
      EMAIL_API_URL=https://utilities-mail-relay.city-of-osceola-missouri.workers.dev
      EMAIL_FROM=utilities-demo@osceolamo.com
      # ------------------
      command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh
      ufw allow 22/tcp; ufw allow 80/tcp; ufw allow 443/tcp; ufw --force enable
      if [ -d /opt/city/.git ]; then git -C /opt/city fetch -q origin && git -C /opt/city reset -q --hard origin/main
      else git clone https://github.com/therealwokewok/city /opt/city; fi
      cd /opt/city/utilities/deploy
      if [ ! -f .env ]; then
        printf 'OWNER_PASSWORD=%s\nAPP_PASSWORD=%s\n' "$(head -c 24 /dev/urandom | base64 | tr -dc A-Za-z0-9)" "$(head -c 24 /dev/urandom | base64 | tr -dc A-Za-z0-9)" > .env
        chmod 600 .env
      fi
      setkey() { grep -v "^$1=" .env > .env.new || true; printf '%s=%s\n' "$1" "$2" >> .env.new; mv .env.new .env; chmod 600 .env; }
      setkey DEMO_HOST "\"$HOSTS\""
      setkey DEMO_ADMIN_EMAIL "$ADMIN_EMAIL"
      setkey EMAIL_API_URL "$EMAIL_API_URL"
      # Made once. Put the same value in the Worker as a secret named MAIL_TOKEN (see deploy/README.md).
      grep -q '^EMAIL_API_TOKEN=' .env || setkey EMAIL_API_TOKEN "$(head -c 24 /dev/urandom | base64 | tr -dc A-Za-z0-9)"
      setkey EMAIL_FROM "$EMAIL_FROM"
      docker compose -f docker-compose.demo.yml up -d --build
      . ./.env
      OWN="postgres://utilities_owner:$OWNER_PASSWORD@db:5432/utilities"
      psql() { docker compose -f docker-compose.demo.yml exec -T db psql -U utilities_owner -d utilities -tAc "$1"; }
      if [ "$(psql 'select count(*) from cities')" = "0" ]; then
        docker compose -f docker-compose.demo.yml exec -T -e OWNER_DATABASE_URL="$OWN" -e DEMO_HOSTS="$MAIN_HOST" -e DEMO_ADMIN_EMAIL="$ADMIN_EMAIL" app node dist/scripts/seed.js > /var/log/demo-seed.log 2>&1
      fi
      psql "update cities set name = '$CITY_NAME', settings = settings || '$CITY_SETTINGS'::jsonb where '$MAIN_HOST' = any(hosts) and not settings ? 'demo_branded'"
      for h in $(echo "$HOSTS" | tr ',' ' '); do
        psql "update cities set hosts = array_append(hosts, '$h') where '$MAIN_HOST' = any(hosts) and not '$h' = any(hosts)"
      done
      # Test users are made once. Re-running would put back roles an administrator took away on purpose.
      if [ ! -f /opt/city/.demo-test-users-done ]; then
        docker compose -f docker-compose.demo.yml exec -T -e OWNER_DATABASE_URL="$OWN" app node dist/scripts/test-users.js "$MAIN_HOST" "$TEST_DOMAIN" > /var/log/demo-test-users.log 2>&1 && touch /opt/city/.demo-test-users-done
      fi
      chmod 600 /var/log/demo-seed.log /var/log/demo-test-users.log 2>/dev/null || true
      echo "demo ready $(date -u)"

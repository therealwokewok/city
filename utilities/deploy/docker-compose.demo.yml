# A public demo: fake payments, sign-in codes written to the log, HTTPS from Caddy.
# Not for real bills. See deploy/README.md.
services:
  db:
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    image: postgres:16.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: utilities_owner
      POSTGRES_PASSWORD: ${OWNER_PASSWORD}
      POSTGRES_DB: utilities
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U utilities_owner"], interval: 3s, retries: 20 }
  migrate:
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    build: { context: .., dockerfile: Dockerfile }
    command: ["node", "dist/src/migrate.js"]
    environment:
      OWNER_DATABASE_URL: postgres://utilities_owner:${OWNER_PASSWORD}@db:5432/utilities
      APP_DB_PASSWORD: ${APP_PASSWORD}
    depends_on: { db: { condition: service_healthy } }
  app:
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ALLOW_DEMO_ADAPTERS: "1"
      TRUST_PROXY: "1"
      DATABASE_URL: postgres://utilities_app:${APP_PASSWORD}@db:5432/utilities
      # Optional: an HTTPS email API (see mail-relay/). Without it, sign-in codes go to the log.
      EMAIL_API_URL: ${EMAIL_API_URL:-}
      EMAIL_API_TOKEN: ${EMAIL_API_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Optional: Stripe TEST keys (sk_test_...) let the demo take pretend payments through Stripe. Never live keys here.
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on: { migrate: { condition: service_completed_successfully } }
  caddy:
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DEMO_HOST: "${DEMO_HOST}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddydata:/data"]
    depends_on: [app]
volumes: { dbdata: {}, caddydata: {} }

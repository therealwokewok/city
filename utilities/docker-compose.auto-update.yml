# Optional: keeps the app on the newest published release. Use it instead of docker-compose.yml:
#   docker compose -f docker-compose.auto-update.yml up -d
# It runs the published image (not a local build), checks once a day, and runs database migrations
# each time the app container starts. Take database backups. See docs/updates.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: utilities_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      POSTGRES_DB: utilities
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U utilities_owner"], interval: 3s, retries: 20 }
  app:
    image: ghcr.io/therealwokewok/city-utilities:latest
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    env_file: .env
    environment:
      RUN_MIGRATIONS_ON_START: "1"
      OWNER_DATABASE_URL: postgres://utilities_owner:${DB_OWNER_PASSWORD}@db:5432/utilities
    ports: ["8080:8080"]
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
  updater:
    image: containrrr/watchtower
    command: ["--cleanup", "--label-enable", "--interval", "86400"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    restart: unless-stopped
volumes: { dbdata: {} }

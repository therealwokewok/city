name: utilities-release
# Publishing a release tagged utilities-v1.2.3 builds the container image that hosts can pull and run.
on:
  push:
    tags: ["utilities-v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#utilities-v}"
          ver="$(node -p "require('./utilities/package.json').version")"
          test "$tag" = "$ver" || { echo "tag $tag does not match package.json $ver"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-utilities" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: utilities
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.ref_name }}

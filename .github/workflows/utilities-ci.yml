name: utilities-ci
on:
  push:
    paths: ["utilities/**", ".github/workflows/utilities-*.yml"]
  pull_request:
    paths: ["utilities/**", ".github/workflows/utilities-*.yml"]
defaults:
  run:
    working-directory: utilities
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: utilities_owner, POSTGRES_PASSWORD: dev, POSTGRES_DB: utilities_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U utilities_owner" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: utilities/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
